name: test-and-package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: Run unit and adversarial tests against the installed package
        run: python -m unittest discover -s tests -v
      - name: Validate static explorer generator and navigation
        run: |
          python -m unittest discover -s site -p test_build_demo.py -v
          node --test site/test_app.cjs
      - name: Smoke test installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          querywitness --version
          python -m querywitness catalog --validate
          querywitness demo count_nullable --out querywitness-demo
          querywitness replay querywitness-demo/witness.json
          querywitness benchmark --out querywitness-benchmark --family count_nullable --trials 1 --repeats 1
