[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "querywitness"
dynamic = ["version"]
description = "Bounded SQLite query testing with minimized, replayable counterexamples"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "loaff123"}]
dependencies = ["sqlglot==27.29.0"]
keywords = ["sql", "sqlite", "testing", "counterexample", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
querywitness = "querywitness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "querywitness.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
querywitness = ["data/*.json"]
